name: writemon
description: 영작몬 - 영어 작문 학습 앱

publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  google_fonts: ^6.1.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^15.1.1
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/monsters_transparent/
    - assets/data/
    - assets/data/beginner/
    - assets/data/intermediate/
    - assets/data/advanced/
    - assets/images/elements/
