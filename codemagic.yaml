workflows:
  ios-unsigned-build:
    name: WriteMon iOS Unsigned Build (Personal Use)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build iOS (xcodebuild, unsigned)
        script: |
          set -e
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=build/ios_dd/Build/Products/Release-iphoneos/Runner.app
          mkdir -p build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr build/ios/iphoneos/WriteMon-unsigned.ipa Payload
          rm -rf Payload
          ls -lh build/ios/iphoneos/WriteMon-unsigned.ipa

    artifacts:
      - build/ios/iphoneos/WriteMon-unsigned.ipa

    publishing:
      email:
        recipients:
          - 91618or@gmail.com
        notify:
          success: true
          failure: true
