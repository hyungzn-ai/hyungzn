workflows:
  ios-unsigned-build:
    name: WriteMon iOS Unsigned Build (Personal Use)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get

      - name: Flutter analyze (선택적, 실패해도 빌드 계속)
        script: |
          flutter analyze || true

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (서명 없음)
        script: |
          cat > /tmp/fix_signing.py << 'EOF'
          import re
          pbxproj = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbxproj) as f:
              content = f.read()
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = "";', content)
          content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          with open(pbxproj, 'w') as f:
              f.write(content)
          print('Done - DEVELOPMENT_TEAM cleared')
          EOF
          python3 /tmp/fix_signing.py
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr WriteMon-unsigned.ipa Payload
          rm -rf Payload
          ls -lh WriteMon-unsigned.ipa
          cd ../../..

    artifacts:
      - build/ios/iphoneos/WriteMon-unsigned.ipa
      - build/ios/iphoneos/Runner.app/**
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - 91618or@gmail.com
        notify:
          success: true
          failure: true
