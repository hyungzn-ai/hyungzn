workflows:
  ios-unsigned-build:
    name: WriteMon iOS Unsigned Build (Personal Use)
    # 무료 macOS 인스턴스 사용 (월 500분 무료 한도)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get

      - name: Flutter analyze (선택적, 실패해도 빌드 계속)
        script: |
          flutter analyze || true

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (서명 없음)
        script: |
          # 개인 사용용이라 코드 서명 없이 빌드.
          # 생성된 Runner.app을 Payload 폴더에 넣어 .ipa로 압축.
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr WriteMon-unsigned.ipa Payload
          rm -rf Payload
          ls -lh WriteMon-unsigned.ipa
          cd ../../..

    artifacts:
      - build/ios/iphoneos/WriteMon-unsigned.ipa
      - build/ios/iphoneos/Runner.app/**
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - 91618or@gmail.com
        notify:
          success: true
          failure: true
