name: 매일 영단어 카톡 발송

on:
  schedule:
    # UTC 기준 22:00 = 한국시간 오전 7:00
    # 시간을 바꾸려면 아래 숫자만 수정하세요 (원하는 KST - 9시간)
    - cron: '0 22 * * *'
  workflow_dispatch:      # 수동 실행 버튼

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 오늘의 단어 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          WORDS_PER_DAY: '10'
        run: python scripts/send_daily_words.py

      - name: 진행 상태 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_state.json assets/data/word_meanings.json || true
          git diff --staged --quiet || git commit -m "chore: 오늘의 단어 발송 기록"
          git push
